<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style_validacao_cep.css">
    <script defer type="module" src="js/script_validacao_cep.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Validação de CEP</title>
</head>

<body>
    <header>
        <img id="logo" src="img/logo_validador125.png" alt="Logo">
        <div id="links">
            <a href="index.html">Home</a>
            <a href="">Sobre</a>
            <a href="validacao_cpf.html">CPF</a>
            <a href="validacao_cep.html">CEP</a>
        </div>
    </header>
    <main>
        <div id="input">
            <h2>Digite aqui seu CEP</h2>
            <div id="content-inputs">
                <input type="text" id="userCEP" autocomplete="off">
            </div>
        </div>
        <div id="result">
            <div id="outForm">
                <label for="ruaCEP">Rua</label>
                <input disabled type="text" class="output" id="ruaCEP">

                <label for="cidadeCEP">Estado</label>
                <input disabled type="text" class="output" id="cidadeCEP">

                <label for="municipioCEP">Município</label>
                <input disabled type="text" class="output" id="municipioCEP">

                <label for="bairroCEP">Bairro</label>
                <input disabled type="text" class="output" id="bairroCEP">

            </div>
        </div>
    </main>
</body>

</html>
